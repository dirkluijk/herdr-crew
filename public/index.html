<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew</title>
<style>
  :root {
    --bg: #14121f; --bg2: #2a2350; --bg3: #1e3a4a; --panel: #1f1c30; --ink: #f4f1ff; --muted: #a39fbf;
    --accent: #f0abfc; --accent2: #93c5fd; --accent3: #86efac; --bubble: #fbf8ff; --bubbleInk: #1d1a2c;
    --working: #4ade80; --idle: #60a5fa; --done: #fbbf24; --blocked: #f87171; --unknown: #c084fc; --mascot: #d6a36b; --closed: #6b6880;
    --font-body: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; --font-heading: var(--font-body);
    --radius: 22px; --bstyle: solid; --bwidth: 1px; --shadow: 0 10px 30px #00000040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.45 var(--font-body); color: var(--ink); min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, var(--bg2) 0, transparent 50%), radial-gradient(circle at 90% 100%, var(--bg3) 0, transparent 45%), var(--bg);
  }
  body.bg-solid { background: var(--bg); }
  body.bg-grid { background: linear-gradient(color-mix(in srgb, var(--accent) 12%, transparent) 1px, transparent 1px) 0 0 / 32px 32px, linear-gradient(90deg, color-mix(in srgb, var(--accent) 12%, transparent) 1px, transparent 1px) 0 0 / 32px 32px, var(--bg); }
  body.bg-dots {
    background: radial-gradient(color-mix(in srgb, var(--muted) 22%, transparent) 1px, transparent 1.2px) 0 0 / 26px 26px,
      radial-gradient(circle at 85% 0%, var(--bg2) 0, transparent 45%), radial-gradient(circle at 5% 100%, var(--bg3) 0, transparent 40%), var(--bg);
    background-attachment: fixed;
  }
  body.bg-stripes { background: repeating-linear-gradient(135deg, var(--bg) 0 24px, color-mix(in srgb, var(--bg2) 60%, var(--bg)) 24px 48px); }
  body.bg-scanlines { background: repeating-linear-gradient(0deg, #00000033 0 2px, transparent 2px 4px), radial-gradient(circle at 50% 30%, var(--bg2), var(--bg) 70%); }
  body.upper .name, body.upper h2, body.upper h1 { text-transform: uppercase; }
  h1, h2, .name { font-family: var(--font-heading); }
  header { display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; padding: 1.6rem 2rem 0.4rem; }
  h1 { margin: 0; font-size: 1.9rem; letter-spacing: -0.02em; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { color: var(--muted); font-size: 0.9rem; }
  .counts { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .pill { padding: 0.15rem 0.65rem; border-radius: 99px; background: #ffffff12; font-size: 0.85rem; color: var(--muted); }
  .pill b { color: var(--ink); }
  .updated { margin-left: auto; color: var(--muted); font-size: 0.85rem; display: flex; gap: 0.6rem; align-items: center; }
  .updated.stale #updated { color: var(--blocked); }
  .updated button { padding: 0.2rem 0.7rem; border-radius: 99px; border: 1px solid #ffffff22; background: #ffffff0d; color: var(--ink); font-size: 0.8rem; }
  h2 { margin: 1.4rem 2rem 0.6rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  h2:empty { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.1rem; padding: 0 2rem 1rem; }
  .card {
    position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 1rem; padding: 1rem;
    background: var(--panel); border-radius: var(--radius); border: var(--bwidth) var(--bstyle) color-mix(in srgb, var(--ink) 12%, transparent);
    box-shadow: var(--shadow); transition: transform .2s, opacity .3s;
  }
  .card:hover { transform: translateY(-2px); }
  .card.closed { opacity: 0.55; }
  .card.closed .avatar img { filter: grayscale(1); }
  .card.new { border: 2px dashed var(--accent); }
  .avatar { position: relative; width: 104px; height: 104px; }
  .avatar img, .avatar .fallback {
    width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 4px solid var(--c);
    background: color-mix(in srgb, var(--panel) 70%, var(--ink)); display: grid; place-items: center; font-size: 2.4rem; font-weight: 700;
  }
  body.av-rounded .avatar img, body.av-rounded .avatar .fallback { border-radius: 24%; }
  body.av-square .avatar img, body.av-square .avatar .fallback { border-radius: 0; }
  body.av-hexagon .avatar img, body.av-hexagon .avatar .fallback { border-radius: 0; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
  .card.working .avatar img, .card.working .avatar .fallback { animation: pulse 1.6s ease-in-out infinite; }
  .card.blocked .avatar img { animation: shake .5s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--c) 25%, transparent); } }
  @keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .status {
    position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    background: var(--c); color: var(--bg); font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.55rem; border-radius: 99px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .who { display: flex; align-items: baseline; gap: 0.45rem; flex-wrap: wrap; }
  .name { font-size: 1.25rem; font-weight: 700; }
  .pron { color: var(--muted); font-size: 0.85rem; }
  .agent { font-family: ui-monospace, monospace; font-size: 0.78rem; color: var(--muted); }
  .role { font-size: 0.88rem; color: color-mix(in srgb, var(--ink) 85%, var(--muted)); margin-top: 0.1rem; }
  .tag { font-size: 0.72rem; padding: 0.05rem 0.5rem; border-radius: 99px; background: var(--accent); color: var(--bg); font-weight: 700; }
  .tasks { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.35rem; }
  .task { font-size: 0.72rem; padding: 0.05rem 0.45rem; border-radius: 6px; background: #ffffff14; color: var(--muted); border: 0; }
  .task.inprog { background: color-mix(in srgb, var(--working) 15%, transparent); color: var(--working); }
  .task.done { text-decoration: line-through; }
  button.task:hover { color: var(--ink); background: #ffffff26; }
  .bubble {
    --bub: color-mix(in srgb, var(--c) 22%, var(--bubble));
    grid-column: 1 / -1; position: relative; margin-top: 0.3rem; padding: 0.75rem 0.95rem;
    background: var(--bub); color: var(--bubbleInk); border: 2px solid color-mix(in srgb, var(--c) 70%, transparent);
    border-radius: 16px; font-size: 0.86rem; white-space: pre-wrap; word-break: break-word; max-height: 11rem; overflow: hidden;
  }
  .bubble::before { content: ""; position: absolute; top: -12px; left: 40px; border: 12px solid transparent; border-top: 0; border-bottom-color: color-mix(in srgb, var(--c) 70%, transparent); }
  .bubble::after { content: ""; position: absolute; top: -9px; left: 42px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--bub); }
  .bubble.empty { opacity: 0.7; font-style: italic; }
  .closed .bubble { --bub: color-mix(in srgb, var(--bubble) 80%, var(--closed)); border-color: var(--closed); }
  .bubble.say { font-size: 0.98rem; font-weight: 600; white-space: normal; }
  .bubble.stale { opacity: 0.6; }
  .headline { font-weight: 800; }
  .traits { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.35rem; }
  .trait { font-size: 0.72rem; padding: 0.05rem 0.5rem; border-radius: 99px; background: color-mix(in srgb, var(--c) 22%, transparent); }
  .quirk { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-top: 0.25rem; }
  .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.75rem; color: var(--muted); }
  .meta .act { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--working); animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 60%, transparent); } }
  .by { margin-right: 0.6rem; padding: 0.05rem 0.45rem; border-radius: 99px; background: #ffffff12; }
  .by.self { background: color-mix(in srgb, var(--c) 30%, transparent); color: var(--ink); }
  .hero { padding: 1rem 2rem 0; }
  .card.lead {
    grid-template-columns: 200px 1fr; grid-template-areas: "av info" "av conv" "av chat" "actions actions" "screen screen" "meta meta";
    column-gap: 1.6rem; padding: 1.5rem 1.8rem; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--c) 14%, var(--panel)), var(--panel) 60%);
  }
  .card.lead .avatar { grid-area: av; width: 200px; height: 200px; }
  .card.lead .avatar img, .card.lead .avatar .fallback { width: 200px; height: 200px; border-width: 6px; }
  .card.lead > div:nth-child(2) { grid-area: info; }
  .card.lead .name { font-size: 2rem; }
  .card.lead .conv { grid-area: conv; }
  .card.lead .chat { grid-area: chat; margin-top: 0.6rem; }
  .card.lead .actions { grid-area: actions; margin-top: 0.8rem; }
  .card.lead .screen { grid-area: screen; margin-top: 0.6rem; }
  .card.lead .meta { grid-area: meta; margin-top: 0.4rem; }
  .card.lead .bubble { max-height: none; white-space: pre-line; font-size: 1.12rem; line-height: 1.55; padding: 1rem 1.3rem; margin-top: 1rem; }
  .card.lead .bubble .headline { font-size: 1.2rem; }
  .card.lead .bubble::before { top: 24px; left: -14px; border: 12px solid transparent; border-left: 0; border-right-color: color-mix(in srgb, var(--c) 70%, transparent); }
  .card.lead .bubble::after { top: 26px; left: -10px; border: 10px solid transparent; border-left: 0; border-right-color: var(--bub); }
  @media (max-width: 760px) {
    .card.lead { grid-template-columns: 1fr; grid-template-areas: "av" "info" "conv" "chat" "actions" "screen" "meta"; }
    .card.lead .bubble::before, .card.lead .bubble::after { display: none; }
  }
  .crown { font-size: 0.8rem; color: var(--done); margin-left: 0.3rem; letter-spacing: 0.08em; text-transform: uppercase; }
  button { font: inherit; cursor: pointer; }
  .actions { grid-column: 1 / -1; display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .actions button { padding: 0.25rem 0.7rem; border-radius: 99px; border: 1px solid #ffffff22; background: #ffffff0d; color: var(--ink); font-size: 0.8rem; }
  .actions button:hover { background: #ffffff1f; }
  .actions button.on { background: color-mix(in srgb, var(--c) 35%, transparent); }
  .actions button.urgent { background: var(--blocked); color: var(--bg); font-weight: 700; }
  .actions button.welcome { background: var(--accent); color: var(--bg); font-weight: 700; border: 0; }
  .screen { grid-column: 1 / -1; margin: 0; padding: 0.7rem; max-height: 26rem; overflow: auto; background: #0b0a12; color: #d8d4ee; border-radius: 12px; font: 0.72rem/1.35 ui-monospace, monospace; white-space: pre; }
  .conv { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 0.45rem; }
  .chat { grid-column: 1 / -1; }
  .chat textarea { width: 100%; resize: none; font: inherit; font-size: 0.86rem; padding: 0.55rem 0.8rem; border-radius: 14px; border: 1px solid #ffffff26; background: var(--bg); color: var(--ink); min-height: 2.4rem; max-height: 200px; }
  .chat textarea:focus { outline: none; border-color: var(--accent); }
  .chat textarea:disabled { opacity: 0.5; }
  .chat-note { font-size: 0.75rem; color: var(--blocked); }
  .inbubble { align-self: flex-end; max-width: 85%; margin: 0.2rem 0 0.4rem; padding: 0.55rem 0.85rem; border-radius: 14px 14px 4px 14px; font-size: 0.82rem; white-space: pre-wrap; word-break: break-word; max-height: 7.5rem; overflow: hidden; }
  .inbubble.me { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 70%, #5b3cff), var(--accent)); color: #fff; }
  .inbubble.other { background: color-mix(in srgb, var(--panel) 60%, var(--muted)); color: var(--ink); }
  .inbubble .from { display: block; font-size: 0.7rem; opacity: 0.8; margin-bottom: 0.15rem; }
  .usage { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.45rem; font-size: 0.72rem; color: var(--muted); }
  .usage .bar { flex: 0 0 120px; height: 6px; border-radius: 99px; background: #ffffff14; overflow: hidden; }
  .usage .bar span { display: block; height: 100%; background: var(--working); }
  .usage.mid .bar span { background: var(--done); } .usage.high .bar span { background: var(--blocked); }
  .usage.mid .lbl { color: var(--done); } .usage.high .lbl { color: var(--blocked); font-weight: 700; }
  .card.mascot { border: 2px dashed color-mix(in srgb, var(--mascot) 60%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--mascot) 18%, var(--panel)), var(--panel) 65%); }
  .card.mascot .status { text-transform: none; letter-spacing: 0; }
  .banner { margin: 1rem 2rem 0; padding: 0.8rem 1.1rem; border-radius: 14px; background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border: 1px solid var(--accent); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .banner button { padding: 0.35rem 0.9rem; border-radius: 10px; border: 0; background: var(--accent); color: var(--bg); font-weight: 700; }
  .widgets { margin: 0 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1rem; }
  .widget { padding: 1rem 1.3rem; background: var(--panel); border-radius: var(--radius); border: var(--bwidth) var(--bstyle) color-mix(in srgb, var(--ink) 12%, transparent); display: flex; flex-direction: column; gap: 0.55rem; }
  .widget .state { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .widget .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--closed); }
  .widget .dot.on { background: var(--working); } .widget .dot.busy { background: var(--done); animation: blink 1s infinite; }
  .widget .info { font: 0.78rem ui-monospace, monospace; color: var(--muted); }
  .widget .links, .widget .btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .widget .links a { font-size: 0.8rem; padding: 0.2rem 0.65rem; border-radius: 99px; background: #ffffff12; color: var(--ink); text-decoration: none; }
  .widget .links a.off { opacity: 0.4; pointer-events: none; }
  .widget .btns button { padding: 0.35rem 0.85rem; border-radius: 10px; border: 1px solid #ffffff26; background: #ffffff12; color: var(--ink); }
  .widget .btns button:disabled { opacity: 0.35; cursor: not-allowed; }
  .widget a.url { color: var(--accent2); }
  .widget pre { margin: 0; max-height: 14rem; overflow: auto; background: #0b0a12; padding: 0.6rem; border-radius: 10px; font-size: 0.72rem; color: #d8d4ee; }
  dialog { width: min(760px, 92vw); border: 0; border-radius: 18px; padding: 1.3rem 1.5rem; background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px #000a; }
  dialog::backdrop { background: #0009; }
  dialog h3 { margin: 0 0 0.6rem; }
  dialog pre { white-space: pre-wrap; max-height: 50vh; overflow: auto; background: #0b0a12; color: #d8d4ee; padding: 0.8rem; border-radius: 10px; font-size: 0.78rem; }
  dialog textarea, dialog input[type=text] { width: 100%; font: inherit; padding: 0.6rem; border-radius: 10px; border: 1px solid #ffffff26; background: var(--bg); color: var(--ink); margin: 0.2rem 0 0.5rem; }
  dialog label { font-size: 0.85rem; color: var(--muted); }
  .row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
  .row button, .keys button { padding: 0.4rem 0.9rem; border-radius: 10px; border: 1px solid #ffffff26; background: #ffffff12; color: var(--ink); }
  .row button.primary { background: var(--idle); color: var(--bg); font-weight: 700; border: 0; }
  .row button.danger { background: var(--blocked); color: var(--bg); font-weight: 700; border: 0; }
  .row button:disabled { opacity: 0.4; }
  .keys { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.6rem 0; }
  .seq { font-family: ui-monospace, monospace; min-height: 1.5rem; color: var(--done); }
  .warn { color: var(--done); margin: 0.4rem 0; }
  .err { color: var(--blocked); margin-top: 0.5rem; min-height: 1.2rem; }
  .hint { color: var(--muted); font-size: 0.85rem; }
  footer { padding: 1rem 2rem 2rem; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <h1 id="title">Crew</h1>
  <div class="counts" id="counts"></div>
  <div class="updated" id="updbox"><span id="updated">…</span><button id="themebtn">🎨</button></div>
</header>
<div class="tagline" id="tagline" style="padding: 0 2rem"></div>
<div id="banner"></div>
<div class="hero" id="lead"></div>
<h2 id="h-new"></h2>
<div class="grid" id="new"></div>
<h2 id="h-widgets"></h2>
<div class="widgets" id="widgets"></div>
<h2 id="h-live"></h2>
<div class="grid" id="live"></div>
<h2 id="h-closed"></h2>
<div class="grid" id="closed"></div>
<dialog id="modal"></dialog>
<footer id="footer"></footer>
<script>
const I18N = {
  nl: {
    titleOf: (p) => `De crew van ${p}`, connecting: "verbinden…", warming: "opwarmen…", updated: (t) => `bijgewerkt ${t}`,
    sections: { live: "Aan boord", closed: "Oud-collega's", widgets: "Widgets", new: "Nieuw aan boord" },
    labels: { working: "aan het werk", idle: "wacht", done: "klaar", blocked: "heeft je nodig", closed: "gestopt", unknown: "onbekend", mascot: "mascotte" },
    now: "net nu", min: (n) => `${n} min geleden`, hour: (n) => `${n} uur geleden`, day: (n) => `${n} d geleden`,
    noWords: "Geen laatste woorden bewaard.", thinking: "denkt na", orchestrator: "👑 orchestrator", mascot: "🌰 mascotte", legend: "geen sessie, wel een legende",
    newTag: "nieuw", unregistered: "niet geregistreerd", informed: (via) => `geïnformeerd${via === "orchestrator" ? " via de orchestrator" : ""}`,
    by: { self: ["✍️ eigen woorden", "Door de agent zelf ingevuld"], stale: ["✍️ vorige beurt", "Eigen woorden van de vorige beurt"], screen: ["🖥 scherm", "Laatste schermregels, geen eigen wolkje"], summary: ["🤖 samengevat", "Samengevat door een model"], mascot: ["🌰 oneliner", "Wisselende oneliner"] },
    goTo: "↗ Ga naar", zoom: "⤢ Zoom", screen: "▤ Scherm", answer: "⚠ Beantwoord dialoog", inform: "👋 Informeer", register: "📝 Registreer",
    chatPh: (n) => `Bericht aan ${n} (Enter verstuurt, Shift+Enter is nieuwe regel)`, chatBlocked: (n) => `${n} wacht op een dialoog, gebruik Beantwoord dialoog`, chatBusy: (n) => `${n} is aan het werk, even wachten…`,
    sending: "versturen…", you: "Jij", viaDash: "via dashboard", context: "context", soon: "compaction nabij, handover nu", prep: "handover voorbereiden",
    banner: (n, lead) => `${n} nieuwe agent${n === 1 ? "" : "s"} zonder persona of wolkje.${lead ? ` Onboarden is werk voor ${lead}.` : ""}`, bannerBtn: (lead) => lead ? `Vraag ${lead} om te onboarden` : "Informeer ze",
    confirm: "Bevestig", cancel: "Annuleren", send: "Versturen", run: "Uitvoeren", close: "Sluiten", next: "Verder", clear: "Wissen", loading: "laden…",
    to: (w, s) => `Naar <b>${w}</b>, status nu <b>${s}</b>.`, serverCheck: "De server controleert de status vlak voor het versturen nog een keer. Deze actie komt in .herdr-crew/actions.log.",
    leadWarn: (n) => `Dit gaat naar de orchestrator. ${n} ziet het als een bericht van jou.`,
    onboardTitle: (n, via, t) => via === "orchestrator" ? `${n} laten onboarden door ${t}` : `${n} informeren over de crew-conventies`,
    registerTitle: (n) => `${n} registreren`, regHint: "Voegt de persona toe aan .herdr-crew.json. Hetzelfde kan met: herdr-crew register <agent> --name …",
    name: "Naam", pronouns: "Voornaamwoorden", role: "Rol",
    dialogTitle: (n) => `Dialoog van ${n} beantwoorden`, dialogHint: "Kies toetsen in volgorde, of typ een eigen antwoord. Je bevestigt daarna nog een keer.", ownAnswer: "Of: eigen antwoord als tekst (zonder Enter)",
    keysLbl: "toetsen in dialoog", textLbl: "tekst in dialoog", log: "Log", hideLog: "Log verbergen", running: "draait",
    themeTitle: "Thema", themeHint: "Beschrijf een thema in vrije tekst. Alleen deze tekst en de projectnaam gaan naar het model, en voor avatars ook naam, rol en karakter van de persona's.",
    themeNow: (n) => n ? `Huidig thema: <b>${n}</b>` : "Standaardthema", themeGen: "Genereer", themeReset: "Terug naar standaard", themeAvatars: "Avatars in dit thema", themeBusy: "thema genereren… (kan een halve minuut duren)",
    noModel: "Geen modeltoegang op de server; het standaardthema blijft staan.",
    footer: "Leest Herdr (agents en schermen), OpenCode-sessiegeschiedenis en Backlog.md. ✍️ vult de agent zelf in, 🖥 zijn de laatste schermregels, 🤖 is een samenvatting. Knoppen doen alleen iets na jouw klik; alles komt in .herdr-crew/actions.log.",
  },
  en: {
    titleOf: (p) => `The ${p} crew`, connecting: "connecting…", warming: "warming up…", updated: (t) => `updated ${t}`,
    sections: { live: "On board", closed: "Former colleagues", widgets: "Widgets", new: "New on board" },
    labels: { working: "working", idle: "waiting", done: "done", blocked: "needs you", closed: "stopped", unknown: "unknown", mascot: "mascot" },
    now: "just now", min: (n) => `${n} min ago`, hour: (n) => `${n} h ago`, day: (n) => `${n} d ago`,
    noWords: "No last words kept.", thinking: "thinking", orchestrator: "👑 orchestrator", mascot: "🌰 mascot", legend: "no session, still a legend",
    newTag: "new", unregistered: "not registered", informed: (via) => `informed${via === "orchestrator" ? " via the orchestrator" : ""}`,
    by: { self: ["✍️ own words", "Set by the agent itself"], stale: ["✍️ previous turn", "Own words from the previous turn"], screen: ["🖥 screen", "Last screen lines, no own bubble"], summary: ["🤖 summary", "Summarised by a model"], mascot: ["🌰 one-liner", "Rotating one-liner"] },
    goTo: "↗ Go to", zoom: "⤢ Zoom", screen: "▤ Screen", answer: "⚠ Answer dialog", inform: "👋 Inform", register: "📝 Register",
    chatPh: (n) => `Message to ${n} (Enter sends, Shift+Enter for a new line)`, chatBlocked: (n) => `${n} waits on a dialog, use Answer dialog`, chatBusy: (n) => `${n} is working, hold on…`,
    sending: "sending…", you: "You", viaDash: "via dashboard", context: "context", soon: "compaction close, hand over now", prep: "prepare a handover",
    banner: (n, lead) => `${n} new agent${n === 1 ? "" : "s"} without a persona or bubble.${lead ? ` Onboarding is ${lead}'s job.` : ""}`, bannerBtn: (lead) => lead ? `Ask ${lead} to onboard` : "Inform them",
    confirm: "Confirm", cancel: "Cancel", send: "Send", run: "Run", close: "Close", next: "Next", clear: "Clear", loading: "loading…",
    to: (w, s) => `To <b>${w}</b>, status now <b>${s}</b>.`, serverCheck: "The server checks the status again right before sending. This action goes into .herdr-crew/actions.log.",
    leadWarn: (n) => `This goes to the orchestrator. ${n} sees it as a message from you.`,
    onboardTitle: (n, via, t) => via === "orchestrator" ? `Ask ${t} to onboard ${n}` : `Tell ${n} the crew conventions`,
    registerTitle: (n) => `Register ${n}`, regHint: "Adds the persona to .herdr-crew.json. Same as: herdr-crew register <agent> --name …",
    name: "Name", pronouns: "Pronouns", role: "Role",
    dialogTitle: (n) => `Answer ${n}'s dialog`, dialogHint: "Pick keys in order, or type your own answer. You confirm once more after this.", ownAnswer: "Or: your own answer as text (without Enter)",
    keysLbl: "keys in dialog", textLbl: "text in dialog", log: "Log", hideLog: "Hide log", running: "running",
    themeTitle: "Theme", themeHint: "Describe a theme in free text. Only this text and the project name go to the model, plus persona name, role and traits for avatars.",
    themeNow: (n) => n ? `Current theme: <b>${n}</b>` : "Default theme", themeGen: "Generate", themeReset: "Back to default", themeAvatars: "Avatars in this theme", themeBusy: "generating theme… (can take half a minute)",
    noModel: "No model access on the server; the default theme stays.",
    footer: "Reads Herdr (agents and screens), OpenCode session history and Backlog.md. ✍️ is set by the agent, 🖥 are the last screen lines, 🤖 is a summary. Buttons only act on your click; everything goes into .herdr-crew/actions.log.",
  },
};
let L = I18N.en;
let config = { theme: null, widgets: [] };
const COLORS = { working: "--working", idle: "--idle", done: "--done", blocked: "--blocked", closed: "--closed", mascot: "--mascot" };
const prev = {};
const openScreens = new Set();
const screens = {};
let current = { agents: [] };
let last = 0;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const label = (s) => config.theme?.labels?.[s] ?? L.labels[s] ?? s;
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return L.now;
  if (s < 3600) return L.min(Math.round(s / 60));
  if (s < 86400) return L.hour(Math.round(s / 3600));
  return L.day(Math.round(s / 86400));
}

const SHADOWS = { none: "none", soft: "0 10px 30px #00000040", hard: "6px 6px 0 #000000aa", glow: "0 0 24px color-mix(in srgb, var(--accent) 45%, transparent)" };
function applyConfig(c) {
  config = c;
  L = I18N[c.language] ?? I18N.en;
  document.documentElement.lang = c.language;
  const root = document.documentElement.style;
  for (const p of [...root]) if (p.startsWith("--")) root.removeProperty(p);
  document.body.className = "";
  document.getElementById("gfonts")?.remove();
  const t = c.theme;
  if (t) {
    for (const [k, v] of Object.entries(t.colors ?? {})) root.setProperty(`--${k}`, v);
    if (t.font?.body) root.setProperty("--font-body", t.font.body);
    if (t.font?.heading) root.setProperty("--font-heading", t.font.heading);
    if (t.font?.google?.length) {
      const link = Object.assign(document.createElement("link"), { id: "gfonts", rel: "stylesheet",
        href: `https://fonts.googleapis.com/css2?${t.font.google.map((f) => `family=${encodeURIComponent(f)}:wght@400;700`).join("&")}&display=swap` });
      document.head.append(link);
    }
    root.setProperty("--radius", `${t.card.radius}px`);
    root.setProperty("--bstyle", t.card.border === "none" ? "solid" : t.card.border);
    root.setProperty("--bwidth", `${t.card.border === "none" ? 0 : t.card.borderWidth}px`);
    root.setProperty("--shadow", SHADOWS[t.card.shadow] ?? SHADOWS.soft);
    document.body.classList.add(`bg-${t.background}`, `av-${t.card.avatarShape}`);
    if (t.card.uppercase) document.body.classList.add("upper");
  }
  const title = t?.title ? t.title.replaceAll("{project}", c.title) : L.titleOf(c.title);
  document.getElementById("title").innerHTML = `<span>${esc(title)}</span>`;
  document.title = title;
  document.getElementById("tagline").textContent = t?.tagline ?? "";
  for (const k of ["live", "closed"]) document.getElementById(`h-${k}`).textContent = t?.sections?.[k] ?? L.sections[k];
  document.getElementById("h-widgets").textContent = c.widgets.length ? t?.sections?.widgets ?? L.sections.widgets : "";
  document.getElementById("footer").textContent = L.footer;
  if (current.updatedAt) render(current);
}

function byTag(a) {
  if (a.sayBy === "self") { const [l, tt] = a.stale ? L.by.stale : L.by.self; return `<span class="by ${a.stale ? "" : "self"}" title="${esc(tt)}">${l}</span>`; }
  const b = L.by[a.sayBy];
  return b ? `<span class="by" title="${esc(b[1])}">${b[0]}</span>` : "";
}

function card(a) {
  const st = a.status in COLORS ? a.status : "unknown";
  const color = `var(${COLORS[st] ?? "--unknown"})`;
  const pic = a.avatar ? `<img src="${esc(a.avatar)}" alt="${esc(a.name)}">` : `<div class="fallback">${esc((a.name || "?")[0])}</div>`;
  const sorted = [...(a.tasks || [])].sort((x, y) => (x.status === "Done") - (y.status === "Done"));
  const tasks = sorted.slice(0, 6).map((t) =>
    `<button class="task ${t.status === "In Progress" ? "inprog" : t.status === "Done" ? "done" : ""}" data-task="${esc(t.id)}" title="${esc(t.title)} (${esc(t.status)})">${esc(t.id)}</button>`).join("");
  const text = [a.headline, a.say || a.detail].filter(Boolean).join("\n\n");
  const changed = prev[a.id] !== undefined && prev[a.id] !== text;
  prev[a.id] = text;
  const bubble = text
    ? `<div class="bubble ${a.say ? "say" : ""} ${a.stale ? "stale" : ""} ${changed ? "flash" : ""}" title="${esc(a.detail || "")}">${a.headline ? `<span class="headline">${esc(a.headline)}</span>\n\n${esc(a.say || a.detail || "")}` : esc(text)}</div>`
    : `<div class="bubble empty">${a.live ? "…" : esc(L.noWords)}</div>`;
  const traits = (a.traits || []).map((t) => `<span class="trait">${esc(t)}</span>`).join("");
  const act = st === "working"
    ? `<span class="act"><span class="dots"><span></span><span></span><span></span></span>${esc(a.activity || a.title || L.thinking)}</span>`
    : `<span class="act">${esc(a.title || "")}</span>`;
  const tags = [
    a.lead ? `<span class="crown">${L.orchestrator}</span>` : "",
    a.mascot ? `<span class="crown">${L.mascot}</span>` : "",
    a.isNew ? `<span class="tag">${esc(L.newTag)}</span>` : "",
    a.live && !a.registered ? `<span class="tag" style="background:var(--done)">${esc(L.unregistered)}</span>` : "",
  ].join("");
  return `<div class="card ${st} ${a.lead ? "lead" : ""} ${a.mascot ? "mascot" : ""} ${a.isNew ? "new" : ""}" style="--c:${color}">
    <div class="avatar">${pic}<span class="status">${esc(a.mascot && !a.live ? a.mascotStatus : label(st))}</span></div>
    <div>
      <div class="who"><span class="name">${esc(a.name)}</span><span class="pron">${esc(a.pronouns)}</span>${tags}</div>
      <div class="agent">${a.mascot && !a.live ? esc(L.legend) : esc(a.id) + (a.pane ? " · " + esc(a.pane) : "")}${a.mascot && a.live ? ` · ${esc(a.mascotStatus)}` : ""}${a.informedAt ? ` · ${esc(L.informed(a.informedVia))}` : ""}</div>
      <div class="role">${esc(a.role)}</div>
      <div class="traits">${traits}</div>
      ${a.quirk ? `<div class="quirk">✨ ${esc(a.quirk)}</div>` : ""}
      <div class="tasks">${tasks}</div>
      ${a.live ? usageBar(a.usage) : ""}
    </div>
    <div class="conv">${conversation(a, bubble)}</div>
    ${a.live ? chatBox(a, st) : ""}
    ${a.live ? actionsRow(a, st) : ""}
    ${a.live && openScreens.has(a.id) ? `<pre class="screen" data-screen="${esc(a.id)}">${esc(screens[a.id] ?? L.loading)}</pre>` : ""}
    <div class="meta">${act}<span>${byTag(a)}${ago(a.since)}</span></div>
  </div>`;
}

function inBubble(a) {
  const m = a.lastIn;
  if (!m || !m.text) return "";
  const max = a.lead ? 500 : 220;
  const text = m.text.length > max ? m.text.slice(0, max) + "…" : m.text;
  const mine = m.from === "Jij" || m.from === "You";
  return `<div class="inbubble ${mine ? "me" : "other"}" title="${esc(m.text)}"><span class="from">${esc(mine ? L.you : m.from)}${m.via === "dashboard" ? ` · ${L.viaDash}` : ""} · ${ago(m.at)}</span>${esc(text)}</div>`;
}

function usageBar(u) {
  if (!u) return "";
  const level = u.pct >= 85 ? "high" : u.pct >= 70 ? "mid" : "low";
  const hint = u.pct >= 85 ? L.soon : u.pct >= 70 ? L.prep : "";
  return `<div class="usage ${level}" title="${u.tokensK}K tokens"><div class="bar"><span style="width:${Math.min(100, u.pct)}%"></span></div>
    <span class="lbl">${L.context} ${u.pct}% · ${Math.round(u.tokensK)}K${hint ? ` · ${hint}` : ""}</span></div>`;
}

function conversation(a, bubble) {
  const inb = inBubble(a);
  if (!inb) return bubble;
  return (Date.parse(a.lastIn?.at ?? 0) || 0) > (Date.parse(a.since ?? 0) || 0) ? bubble + inb : inb + bubble;
}

const drafts = {};
const chatNote = {};
function chatBox(a, st) {
  const can = st === "idle" || st === "done";
  const ph = can ? L.chatPh(a.name) : st === "blocked" ? L.chatBlocked(a.name) : L.chatBusy(a.name);
  return `<div class="chat"><textarea data-chat="${esc(a.id)}" rows="1" maxlength="4000" placeholder="${esc(ph)}" ${can ? "" : "disabled"}>${esc(drafts[a.id] ?? "")}</textarea>
    <div class="chat-note">${esc(chatNote[a.id] ?? "")}</div></div>`;
}

async function sendChat(ta) {
  const id = ta.dataset.chat;
  const text = ta.value.trim();
  if (!text || ta.dataset.sending) return;
  const a = agentById(id);
  if (config.confirmPrompt) return confirmStep(a, L.send, text, async () => { await api(`api/agents/${encodeURIComponent(id)}/prompt`, { confirmed: true, text }); drafts[id] = ""; ta.value = ""; });
  ta.dataset.sending = "1";
  chatNote[id] = L.sending;
  ta.nextElementSibling.textContent = chatNote[id];
  try {
    await api(`api/agents/${encodeURIComponent(id)}/prompt`, { text });
    drafts[id] = ""; ta.value = ""; chatNote[id] = "";
  } catch (e) { chatNote[id] = e.message; }
  delete ta.dataset.sending;
  const note = document.querySelector(`textarea[data-chat="${CSS.escape(id)}"] + .chat-note`);
  if (note) note.textContent = chatNote[id];
}

document.addEventListener("input", (ev) => {
  const ta = ev.target.closest?.("textarea[data-chat]");
  if (!ta) return;
  drafts[ta.dataset.chat] = ta.value;
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 200) + "px";
});
document.addEventListener("keydown", (ev) => {
  const ta = ev.target.closest?.("textarea[data-chat]");
  if (!ta || ev.key !== "Enter" || ev.shiftKey || ev.isComposing) return;
  ev.preventDefault();
  sendChat(ta);
});

function actionsRow(a, st) {
  const id = esc(a.id);
  return `<div class="actions">
    <button data-act="focus" data-id="${id}">${L.goTo}</button>
    <button data-act="zoom" data-id="${id}">${L.zoom}</button>
    <button data-act="screen" data-id="${id}" class="${openScreens.has(a.id) ? "on" : ""}">${L.screen}</button>
    ${!a.lead && !a.mascot && (a.isNew || !a.registered) ? `<button data-act="onboard" data-id="${id}" class="welcome">${L.inform}</button>` : ""}
    ${!a.registered ? `<button data-act="register" data-id="${id}">${L.register}</button>` : ""}
    ${st === "blocked" ? `<button data-act="answer" data-id="${id}" class="urgent">${L.answer}</button>` : ""}
  </div>`;
}

function render(snap) {
  last = Date.now();
  const active = document.activeElement?.dataset?.chat ? document.activeElement : null;
  const focus = active && { id: active.dataset.chat, start: active.selectionStart, end: active.selectionEnd };
  current = snap;
  const agents = snap.agents;
  const fresh = agents.filter((a) => a.live && a.isNew);
  document.getElementById("lead").innerHTML = agents.filter((a) => a.lead).map(card).join("");
  document.getElementById("h-new").textContent = fresh.length ? config.theme?.sections?.new ?? L.sections.new : "";
  document.getElementById("new").innerHTML = fresh.map(card).join("");
  document.getElementById("live").innerHTML = agents.filter((a) => !a.lead && !a.isNew && (a.live || a.mascot)).map(card).join("");
  document.getElementById("closed").innerHTML = agents.filter((a) => !a.live && !a.lead && !a.mascot).map(card).join("");
  const leadName = config.onboardingVia === "orchestrator" ? config.lead : null;
  document.getElementById("banner").innerHTML = fresh.length && leadName
    ? `<div class="banner"><span>${esc(L.banner(fresh.length, leadName))}</span><button data-onboard-all>${esc(L.bannerBtn(leadName))}</button></div>` : "";
  document.querySelectorAll("pre[data-screen]").forEach((el) => (el.scrollTop = el.scrollHeight));
  document.querySelectorAll("textarea[data-chat]").forEach((ta) => { if (ta.value) ta.style.height = Math.min(ta.scrollHeight, 200) + "px"; });
  if (focus) {
    const ta = document.querySelector(`textarea[data-chat="${CSS.escape(focus.id)}"]`);
    if (ta && !ta.disabled) { ta.focus(); ta.setSelectionRange(focus.start, focus.end); }
  }
  const n = (s) => agents.filter((a) => a.status === s).length;
  document.getElementById("counts").innerHTML = ["working", "idle", "done", "blocked", "closed"].map((s) => `<span class="pill"><b>${n(s)}</b> ${esc(label(s))}</span>`).join("");
  document.getElementById("updated").textContent = snap.updatedAt ? L.updated(new Date(snap.updatedAt).toLocaleTimeString(config.language === "nl" ? "nl-NL" : "en-GB")) : L.warming;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json", "x-crew": "1" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function refreshScreens() {
  for (const id of openScreens) {
    try { screens[id] = (await api(`api/agents/${encodeURIComponent(id)}/screen`)).text; } catch (e) { screens[id] = e.message; }
    const el = document.querySelector(`pre[data-screen="${CSS.escape(id)}"]`);
    if (el) {
      const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
      el.textContent = screens[id];
      if (atBottom) el.scrollTop = el.scrollHeight;
    }
  }
}
setInterval(refreshScreens, 4000);

const modal = document.getElementById("modal");
const agentById = (id) => current.agents.find((a) => a.id === id);
const who = (a) => `${a.name} (${a.id}, ${a.pane})`;
function showModal(html) { modal.innerHTML = html; if (!modal.open) modal.showModal(); }

async function openTask(id) {
  showModal(`<h3>${esc(id)}</h3><pre>${L.loading}</pre><div class="row"><button data-close>${L.close}</button></div>`);
  try { modal.querySelector("pre").textContent = (await api(`api/tasks/${encodeURIComponent(id)}`)).text; } catch (e) { modal.querySelector("pre").textContent = e.message; }
}

// Shows the exact target and content; sends only on an explicit click.
function confirmStep(a, title, shown, sendFn) {
  showModal(`<h3>${L.confirm}: ${esc(title)}</h3>
    <p>${L.to(esc(who(a)), esc(label(a.status)))}</p>
    ${a.lead ? `<p class="warn">${esc(L.leadWarn(a.name))}</p>` : ""}
    <pre>${esc(shown)}</pre><p class="hint">${L.serverCheck}</p><div class="err"></div>
    <div class="row"><button data-close>${L.cancel}</button><button class="danger" data-confirm>${L.send}</button></div>`);
  modal.querySelector("[data-confirm]").onclick = async (ev) => {
    ev.target.disabled = true;
    try { await sendFn(); modal.close(); } catch (e) { modal.querySelector(".err").textContent = e.message; ev.target.disabled = false; }
  };
}

async function openOnboard(a) {
  try {
    const plan = await api(`api/agents/${encodeURIComponent(a.id)}/onboarding`);
    const target = agentById(plan.target) ?? a;
    confirmStep(target, L.onboardTitle(a.name, plan.via, plan.targetName), plan.text, () => api(`api/agents/${encodeURIComponent(a.id)}/onboard`, { confirmed: true }));
  } catch (e) { alert(e.message); }
}

async function openOnboardAll() {
  try {
    const plan = await api("api/crew/onboard");
    if (!plan.target) return;
    const target = agentById(plan.target);
    confirmStep(target, L.bannerBtn(plan.targetName), plan.text, () => api("api/crew/onboard", { confirmed: true }));
  } catch (e) { alert(e.message); }
}

function openRegister(a) {
  const s = a.suggestion ?? {};
  showModal(`<h3>${esc(L.registerTitle(a.id))}</h3>
    <label>${L.name}</label><input type="text" name="name" maxlength="40" value="${esc(s.name ?? (a.name !== a.id ? a.name : ""))}">
    <label>${L.pronouns}</label><input type="text" name="pronouns" maxlength="24" value="${esc(s.pronouns ?? a.pronouns ?? "")}">
    <label>${L.role}</label><input type="text" name="role" maxlength="140" value="">
    <p class="hint">${esc(L.regHint)}</p><div class="err"></div>
    <div class="row"><button data-close>${L.cancel}</button><button class="primary" data-confirm>${L.register}</button></div>`);
  modal.querySelector("[data-confirm]").onclick = async (ev) => {
    const v = (n) => modal.querySelector(`[name=${n}]`).value;
    ev.target.disabled = true;
    try { await api(`api/agents/${encodeURIComponent(a.id)}/register`, { confirmed: true, name: v("name"), pronouns: v("pronouns"), role: v("role") }); modal.close(); }
    catch (e) { modal.querySelector(".err").textContent = e.message; ev.target.disabled = false; }
  };
}

const KEY_LABELS = { up: "↑", down: "↓", left: "←", right: "→", enter: "Enter", esc: "Esc", tab: "Tab", space: "Space" };
async function openAnswer(a) {
  const keys = [];
  showModal(`<h3>${esc(L.dialogTitle(a.name))}</h3><pre class="dlg">${L.loading}</pre><p class="hint">${L.dialogHint}</p>
    <div class="keys">${[...Object.keys(KEY_LABELS), "1", "2", "3", "4", "5", "6", "7", "8", "9"].map((k) => `<button data-key="${k}">${KEY_LABELS[k] ?? k}</button>`).join("")}</div>
    <div class="seq"></div><input type="text" maxlength="4000" placeholder="${esc(L.ownAnswer)}">
    <div class="row"><button data-close>${L.cancel}</button><button data-clear>${L.clear}</button><button class="primary" data-next>${L.next}</button></div>`);
  const seq = modal.querySelector(".seq");
  modal.querySelectorAll("[data-key]").forEach((b) => (b.onclick = () => { if (keys.length < 10) keys.push(b.dataset.key); seq.textContent = keys.map((k) => KEY_LABELS[k] ?? k).join("  "); }));
  modal.querySelector("[data-clear]").onclick = () => { keys.length = 0; seq.textContent = ""; };
  modal.querySelector("[data-next]").onclick = () => {
    const text = modal.querySelector("input").value;
    const base = `api/agents/${encodeURIComponent(a.id)}`;
    if (text.trim()) return confirmStep(a, L.textLbl, text, () => api(`${base}/type`, { confirmed: true, text }));
    if (keys.length) return confirmStep(a, L.keysLbl, keys.map((k) => KEY_LABELS[k] ?? k).join("  "), () => api(`${base}/keys`, { confirmed: true, keys: [...keys] }));
  };
  try { modal.querySelector(".dlg").textContent = (await api(`api/agents/${encodeURIComponent(a.id)}/screen`)).text.split("\n").slice(-30).join("\n"); }
  catch (e) { modal.querySelector(".dlg").textContent = e.message; }
}

function openTheme() {
  const t = config.theme;
  showModal(`<h3>${L.themeTitle}</h3><p>${L.themeNow(t ? esc(t.name) : "")}${t?.prompt ? ` <span class="hint">(${esc(t.prompt)})</span>` : ""}</p>
    ${config.themeModel ? `<textarea name="prompt" maxlength="300" rows="2" placeholder="retro arcade · Hollands kantoor in de jaren negentig · space station">${esc(t?.prompt ?? "")}</textarea><p class="hint">${esc(L.themeHint)}</p>` : `<p class="warn">${esc(L.noModel)}</p>`}
    <div class="err"></div>
    <div class="row"><button data-close>${L.close}</button>
      ${t ? `<button data-theme="reset">${L.themeReset}</button>` : ""}
      ${t && config.themeAvatars ? `<button data-theme="avatars" ${config.avatarJob ? "disabled" : ""}>${L.themeAvatars}</button>` : ""}
      ${config.themeModel ? `<button class="primary" data-theme="generate">${L.themeGen}</button>` : ""}</div>`);
  modal.querySelectorAll("[data-theme]").forEach((b) => (b.onclick = async () => {
    const kind = b.dataset.theme;
    const err = modal.querySelector(".err");
    modal.querySelectorAll("[data-theme]").forEach((x) => (x.disabled = true));
    if (kind === "generate") err.textContent = L.themeBusy;
    try {
      const body = kind === "reset" ? { confirmed: true, reset: true } : kind === "avatars" ? { confirmed: true, avatars: true } : { confirmed: true, prompt: modal.querySelector("[name=prompt]").value };
      await api("api/theme", body);
      applyConfig(await api("api/config"));
      modal.close();
    } catch (e) {
      err.textContent = e.message;
      modal.querySelectorAll("[data-theme]").forEach((x) => (x.disabled = false));
    }
  }));
}
document.getElementById("themebtn").onclick = openTheme;

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.hasAttribute("data-close")) return modal.close();
  if (t.hasAttribute("data-onboard-all")) return openOnboardAll();
  if (t.dataset.task) return openTask(t.dataset.task);
  const a = t.dataset.id && agentById(t.dataset.id);
  if (!a) return;
  const act = t.dataset.act;
  if (act === "screen") {
    openScreens.has(a.id) ? openScreens.delete(a.id) : openScreens.add(a.id);
    render(current);
    if (openScreens.has(a.id)) refreshScreens();
    return;
  }
  if (act === "answer") return openAnswer(a);
  if (act === "onboard") return openOnboard(a);
  if (act === "register") return openRegister(a);
  if (act === "focus" || act === "zoom") {
    t.disabled = true;
    try { await api(`api/agents/${encodeURIComponent(a.id)}/${act}`, {}); } catch (e) { alert(e.message); }
    t.disabled = false;
  }
});

// Widgets: generic rendering of the view each plugin returns.
const widgetLog = {};
let widgetViews = [];
function widgetPanel(w) {
  return `<div class="widget">
    <div class="state"><span class="dot ${w.state}"></span><b>${esc(w.title)}</b> <span>${w.url ? `<a class="url" href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.text)}</a>` : esc(w.text ?? "")}</span></div>
    ${(w.info ?? []).map((i) => `<div class="info">${esc(i)}</div>`).join("")}
    ${w.warning ? `<div class="warn">${esc(w.warning)}</div>` : ""}${w.error ? `<div class="err">${esc(w.error)}</div>` : ""}
    <div class="btns">${(w.buttons ?? []).map((b) => `<button data-widget="${esc(w.id)}" data-waction="${esc(b.action)}" ${b.disabled ? "disabled" : ""}>${esc(b.label)}</button>`).join("")}
      <button data-widget="${esc(w.id)}" data-waction="log">${widgetLog[w.id] ? L.hideLog : L.log}</button></div>
    ${(w.links ?? []).length ? `<div class="links">${w.links.map((l) => `<a class="${l.enabled ? "" : "off"}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a>`).join("")}</div>` : ""}
    ${widgetLog[w.id] ? `<pre data-wlog="${esc(w.id)}">${L.loading}</pre>` : ""}
  </div>`;
}
function renderWidgets() {
  document.getElementById("widgets").innerHTML = widgetViews.map(widgetPanel).join("");
  for (const w of widgetViews) if (widgetLog[w.id]) api(`api/widgets/${w.id}/log`).then((r) => {
    const pre = document.querySelector(`pre[data-wlog="${CSS.escape(w.id)}"]`);
    if (pre) { pre.textContent = r.text || "(empty)"; pre.scrollTop = pre.scrollHeight; }
  }).catch(() => {});
}
async function pollWidgets() {
  if (config.widgets.length) {
    try { widgetViews = await api("api/widgets"); renderWidgets(); } catch {}
  }
  setTimeout(pollWidgets, widgetViews.some((w) => w.busy) ? 2000 : 6000);
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-widget]");
  if (!b) return;
  const { widget, waction } = b.dataset;
  if (waction === "log") { widgetLog[widget] = !widgetLog[widget]; return renderWidgets(); }
  const w = widgetViews.find((x) => x.id === widget);
  const { confirm } = await api(`api/widgets/${widget}/${waction}`);
  showModal(`<h3>${L.confirm}: ${esc(w.title)} · ${esc(b.textContent)}</h3><pre>${esc(confirm)}</pre><p class="hint">${L.serverCheck}</p><div class="err"></div>
    <div class="row"><button data-close>${L.cancel}</button><button class="danger" data-confirm>${L.run}</button></div>`);
  modal.querySelector("[data-confirm]").onclick = async (e) => {
    e.target.disabled = true;
    try { await api(`api/widgets/${widget}/${waction}`, { confirmed: true }); modal.close(); widgetViews = await api("api/widgets"); renderWidgets(); }
    catch (err) { modal.querySelector(".err").textContent = err.message; e.target.disabled = false; }
  };
});

(async () => {
  applyConfig(await api("api/config"));
  document.getElementById("updated").textContent = L.connecting;
  pollWidgets();
  const es = new EventSource("events");
  es.onmessage = (e) => render(JSON.parse(e.data));
  // Picks up theme or language changes made from the CLI or another tab.
  setInterval(async () => {
    const c = await api("api/config").catch(() => null);
    if (c && JSON.stringify(c) !== JSON.stringify(config)) applyConfig(c);
  }, 15000);
  setInterval(() => document.getElementById("updbox").classList.toggle("stale", Date.now() - last > 20000), 5000);
})();
</script>
</body>
